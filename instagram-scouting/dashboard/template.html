<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: a field notebook. One narrow column of evidence cards; numbers in mono; opinion always sits in a tinted "reading" block so it never passes for a number. */
:root{
  --bg:#f1f3ee; --surface:#ffffff; --ink:#15211d; --muted:#5d6c66; --line:#d9dfd8; --accent:#0d6b5a; --accent-soft:#dcefe9;
  --good:#1c7c45; --warn:#a8690d; --bad:#ad3b2b; --wait:#6c7480; --read:#f6f1e1; --read-line:#e3d9b8;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1513; --surface:#161f1c; --ink:#e6eee9; --muted:#93a39c; --line:#2a3632; --accent:#56cfb1; --accent-soft:#17332c;
  --good:#5fc98a; --warn:#e0a94a; --bad:#ec7f6c; --wait:#9aa3ad; --read:#242317; --read-line:#3d3a22; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0e1513; --surface:#161f1c; --ink:#e6eee9; --muted:#93a39c; --line:#2a3632; --accent:#56cfb1; --accent-soft:#17332c;
  --good:#5fc98a; --warn:#e0a94a; --bad:#ec7f6c; --wait:#9aa3ad; --read:#242317; --read-line:#3d3a22; color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-text-size-adjust:100%}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 64px}
header.top{padding:22px 0 10px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
h1{font:700 26px/1.1 var(--display);margin:0;letter-spacing:-.01em}
h2{font:700 20px/1.2 var(--display);margin:28px 0 10px;text-wrap:balance}
h3{font:600 15px/1.3 var(--body);margin:0 0 4px}
.sub{color:var(--muted);font-size:13px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);font-weight:500;font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid transparent}
nav.tabs a[aria-current="true"]{color:var(--accent);background:var(--accent-soft);border-color:var(--accent)}
nav.tabs a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible,.dot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.view{display:none} section.view.on{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stack{display:grid;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile .big{font:700 28px/1 var(--display);margin:2px 0 4px}
.tile .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.profile{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
.profile .h{font:700 22px/1.1 var(--display)}
.evi{border-left:4px solid var(--good)} .evi.weak{border-left-color:var(--bad)} .evi.mix{border-left-color:var(--accent)} .evi.none{border-left-color:var(--wait)}
.numbers{font-size:14px;margin:4px 0 8px}
.reading{background:var(--read);border:1px solid var(--read-line);border-radius:8px;padding:8px 10px;font-size:14px}
.reading b{font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block;margin-bottom:2px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.good{color:var(--good);border-color:var(--good)} .pill.warn{color:var(--warn);border-color:var(--warn)} .pill.bad{color:var(--bad);border-color:var(--bad)} .pill.wait{color:var(--wait);border-style:dashed} .pill.acc{color:var(--accent);border-color:var(--accent)}
.pill.plain::before{display:none}
/* concept strip plot */
.strip{display:grid;gap:14px}
.strip .lane{display:grid;gap:4px}
.strip .head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.track{position:relative;height:30px;border-radius:6px;background:linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat}
.dot{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--muted);border:2px solid var(--surface);padding:0;cursor:pointer;opacity:.85}
.dot.hit{background:var(--accent);opacity:1;width:16px;height:16px;margin:-8px 0 0 -8px}
.dot.pin{background:var(--surface);border:3px solid var(--accent);opacity:1}
.dot.fresh{background:var(--surface);border:2px dashed var(--wait)}
.dot.sel{outline:2px solid var(--ink);outline-offset:2px}
.med{position:absolute;top:3px;bottom:3px;width:2px;background:var(--ink)}
.pagemed{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--warn)}
.axis{position:relative;height:18px;font-size:11px;color:var(--muted)} .axis span{position:absolute;transform:translateX(-50%);font-family:var(--mono)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;vertical-align:-2px;margin-right:5px}
.tip{margin-top:10px}
/* reels */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 13px var(--body);padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
select,input,textarea{font:400 14px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
.rowwrap{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:11px 14px;background:none;border:0;border-radius:10px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.row .hook{font-weight:500}
.row .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.row .v{text-align:right} .row .v .big{font:500 17px/1.1 var(--mono)} .row .v .x{font-size:12px;color:var(--muted)}
.bar{grid-column:1/-1;height:5px;border-radius:3px;background:var(--line);overflow:hidden} .bar i{display:block;height:100%;background:var(--muted)} .bar.hit i{background:var(--accent)}
.detail{display:grid;gap:8px;border-top:1px solid var(--line);padding:10px 14px 12px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kv div{background:var(--bg);border-radius:8px;padding:7px 9px} .kv .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em} .kv .val{font:500 15px var(--mono)} .kv .r{font-size:12px;color:var(--muted)}
.stages{display:flex;gap:5px;flex-wrap:wrap}
a.out{color:var(--accent)}
/* pipeline */
.tool{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:start}
.prog{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;font-size:13px}
.prog .barp{height:9px;border-radius:5px;background:var(--line);overflow:hidden} .prog .barp i{display:block;height:100%;background:var(--good)} .prog.waiting .barp{background:repeating-linear-gradient(135deg,var(--line) 0 6px,transparent 6px 12px);border:1px dashed var(--wait)}
.matrix{overflow-x:auto} .matrix table{border-collapse:collapse;font-size:12px;width:100%;table-layout:fixed}
.matrix th,.matrix td{padding:5px 2px;border-bottom:1px solid var(--line);text-align:center;width:44px;font-weight:500} .matrix th{font-size:10.5px;color:var(--muted)} .matrix th:first-child,.matrix td:first-child{text-align:left;width:auto;overflow-wrap:anywhere}
.s{display:inline-block;width:11px;height:11px;border-radius:50%} .s.y{background:var(--good)} .s.n{border:1.5px solid var(--line)} .s.w{border:1.5px dashed var(--wait)}
pre.cmd{font:400 13px/1.6 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;margin:6px 0 0}
/* request */
form.req{display:grid;gap:10px} form.req label{display:grid;gap:4px;font-size:13px;font-weight:500}
button.go{font:600 14px var(--body);padding:9px 16px;border-radius:8px;border:0;background:var(--accent);color:var(--surface);cursor:pointer;justify-self:start}
button.ghost{font:500 13px var(--body);padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.msg{font-size:13px;color:var(--muted)}
.qrow{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
footer{margin-top:36px;font-size:12px;color:var(--muted)}
@media (max-width:520px){ .prog{grid-template-columns:104px 1fr 46px} h1{font-size:22px} }
@media (prefers-reduced-motion:no-preference){ .bar i,.prog .barp i{transition:width .4s} }
</style>
</head>

    h("div", { class: "legend", style: "margin-top:12px" }, h("span", {}, "Dots on each reel: "), D.status.stages.map(s => h("span", {}, s.name)), h("span", {}, h("i", { class: "s y" }), "done"), h("span", {}, h("i", { class: "s n" }), "not done"), h("span", {}, h("i", { class: "s w" }), "waiting for command line"))
  ];
}

/* ---------- shapes ---------- */
function vShapes() {
  return [h("p", { class: "sub" }, "Structures worth borrowing, described in our own words. Her wording, look, music and rituals are not taken. The \"ours\" line is a first draft for Tarot Talk and has not been through script review."),
    h("div", { class: "stack" }, P.findings.shapes.map(s => card("evi " + (s.ok ? "" : "weak"), h("div", { class: "qrow" }, h("h3", {}, s.name), pill(s.ok ? "usable" : "do not use", s.ok ? "good" : "bad")), h("div", { class: "sub" }, "Seen in: " + s.from), h("div", { class: "numbers" }, s.structure), reading(s.ours, s.ok ? "Ours could be" : "Why not")))) ];
}

/* ---------- growth ---------- */
function vGrowth() {
  const g = P.findings.growing;
  return [card("evi mix", h("h3", {}, "Which reels keep growing?"), h("div", { class: "numbers" }, g.text), reading(g.next, "Next step")),
    h("h2", {}, "Looks so far"),
    card("", h("div", { class: "stack" }, P.snapshots.map(s => h("div", { class: "qrow" }, h("span", { class: "num" }, s.at + " IST" + (s.approx ? " (about)" : "")), h("span", { class: "sub" }, s.n + " reels read"))))),
    h("h2", {}, "Moved between the first and last look"),
    P.growth.length ? card("", h("div", { class: "stack" }, P.growth.map(x => { const r = P.reels.find(y => y.id === x.id); return h("div", { class: "qrow" }, h("span", {}, r ? r.cover : x.id), h("span", { class: "num" }, fmt(x.frm) + " to " + fmt(x.to) + "  +" + (x.to - x.frm).toLocaleString())); })), h("div", { class: "sub", style: "margin-top:8px" }, "Counts on the grid are rounded, so small moves on large reels do not show.")) : card("", "No change seen.")];
}

/* ---------- pipeline ---------- */
function vPipeline() {
  const st = D.status, cli = st.cli, cls = { working: "good", ready: "acc", waiting: "wait", failed: "bad" }, word = { working: "working", ready: "ready, not used here", waiting: "waiting", failed: "stopped" };
  const tools = st.tools.map(t => { let state = t.state, detail = t.detail; if (cli && cli.tools && t.key in cli.tools) { const ok = cli.tools[t.key]; const ran = (cli.runs || []).some(r => r.done && r.done.length), lastRun = (cli.runs || [])[(cli.runs || []).length - 1], stopped = lastRun && lastRun.failed && !lastRun.done.length; state = !ok ? "waiting" : stopped ? "failed" : ran ? "working" : "ready"; detail = !ok ? "Not installed on " + cli.machine + " (checked " + cli.checked + ")." : stopped ? "Installed, but the last run stopped (" + (lastRun.failed.kind || "error") + "): " + lastRun.failed.why : ran ? "Installed on " + cli.machine + " and used." : "Installed on " + cli.machine + ", not run yet."; } return { ...t, state, detail }; });
  const total = P.reels.length;
  const last = cli && cli.runs && cli.runs[cli.runs.length - 1];
  return [
    h("p", { class: "sub" }, "What each tool has read so far, and what is still waiting. Updated " + st.updated + "."),
    card("", h("h3", {}, "How far each step has gone on @" + handle), h("div", { class: "stack", style: "margin-top:8px" }, st.stages.map(s => { const n = P.reels.filter(r => r.stages[s.key]).length, waiting = n === 0 && (s.tool === "whisper" || s.tool === "ffmpeg"); return h("div", { class: "prog" + (waiting ? " waiting" : "") }, h("span", {}, s.name), h("div", { class: "barp" }, h("i", { style: "width:" + (100 * n / total) + "%" })), h("span", { class: "num" }, n + "/" + total)); }))),
    h("h2", {}, "Tools"),
    h("div", { class: "stack" }, tools.map(t => card("", h("div", { class: "tool" }, h("h3", {}, t.name), pill(word[t.state], cls[t.state]), h("div", { class: "sub", style: "grid-column:1/-1" }, t.does), h("div", { style: "grid-column:1/-1;font-size:14px" }, t.detail))))),
    h("h2", {}, "Command-line step"),
    card("evi " + (cli ? "" : "weak"), h("div", { class: "qrow" }, h("h3", {}, cli ? "Checked on " + cli.machine : "Not run on any computer yet"), pill(!cli ? "waiting" : last && last.done.length ? "has run" : last && last.failed ? "stopped" : "checked only", !cli ? "wait" : last && last.done.length ? "good" : last && last.failed ? "bad" : "acc")),
      cli ? h("div", { class: "numbers" }, "Last check " + cli.checked + ". " + (last ? "Last run finished " + last.finished + ": " + last.done.length + " reels done" + (last.failed ? ", stopped at " + last.failed.id + " (" + (last.failed.kind || "error") + ": " + last.failed.why + ")" : "") + "." : "No run yet."))
          : h("div", { class: "numbers" }, "Transcripts and audio stats need the script to be run on your PC. Until it has run and pushed its results, those steps stay marked as waiting everywhere on this page. Fetching reels with a script is against Instagram's terms; it runs only by your choice, slowly, without logging in, and stops at the first refusal."),
      h("div", { class: "sub" }, "In the AI repo folder, in a terminal:"),
      h("pre", { class: "cmd" }, "cd instagram-scouting\npython cli/scout_cli.py check\npython cli/scout_cli.py queue " + handle + "\npython cli/scout_cli.py run\npython cli/scout_cli.py push")),
    h("h2", {}, "Every reel, every step"),
    card("", h("div", { class: "matrix" }, h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "Reel"), st.stages.map(s => h("th", { title: s.name }, s.short || s.name)))),
      h("tbody", {}, P.reels.map(r => h("tr", {}, h("td", {}, r.cover || "Cover not read (" + r.id + ")"), st.stages.map(s => { const v = r.stages[s.key], waiting = !v && (s.tool === "whisper" || s.tool === "ffmpeg"); return h("td", {}, h("span", { class: "s " + (v ? "y" : waiting ? "w" : "n"), role: "img", "aria-label": v ? "done" : waiting ? "waiting for command line" : "not done" })); })))))),
      h("div", { class: "legend", style: "margin-top:10px" }, h("span", {}, h("i", { class: "s y" }), "done"), h("span", {}, h("i", { class: "s n" }), "not done yet"), h("span", {}, h("i", { class: "s w" }), "waiting for command line")))
  ];
}

/* ---------- request ---------- */
let db = null;
function reqText(r) { return "Scout request: " + ({ page: "Instagram page", topic: "topic", competitor: "competitor" }[r.kind]) + " \"" + r.target + "\"" + (r.note ? ". Note: " + r.note : ""); }
function vRequest() {
  const all = [...(state.dbReqs || []), ...D.requests.filter(r => !(state.dbReqs || []).some(x => x.target === r.target && x.kind === r.kind))];
  const msg = h("div", { class: "msg", id: "reqmsg", role: "status" });
  const form = h("form", { class: "req", onsubmit: async e => {
      e.preventDefault(); const r = { kind: $("#kind").value, target: $("#target").value.trim().replace(/^@/, ""), note: $("#note").value.trim(), asked: new Date(Date.now() + 5.5 * 3600e3).toISOString().slice(0, 10), state: "queued" };
      if (!r.target) { msg.textContent = "Type a page handle or a topic first."; return; }
      if (db) { try { await db.collection("requests").add(r); msg.textContent = "Saved to the queue. Nothing starts by itself: Claude reads this queue when you next ask it to scout."; e.target.reset(); return; } catch (err) { msg.textContent = "Could not save it here (" + (err && err.code || "error") + "). Copy the request below and send it to Claude instead."; } }
      else msg.textContent = "This copy of the page cannot save requests. Copy the line below and send it to Claude.";
      const box = $("#copybox"); box.hidden = false; $("#copytext").value = reqText(r);
    } },
    h("label", { for: "kind" }, "What to scout", h("select", { id: "kind" }, h("option", { value: "page" }, "An Instagram page"), h("option", { value: "competitor" }, "A competitor of Tarot Talk"), h("option", { value: "topic" }, "A topic"))),
    h("label", { for: "target" }, "Page handle or topic", h("input", { id: "target", placeholder: "for example: a page's @handle, or \"numerology 2027\"", autocomplete: "off" })),
    h("label", { for: "note" }, "What you want to know (optional)", h("textarea", { id: "note", rows: "2", placeholder: "for example: which of their hooks would suit our driver series" })),
    h("button", { class: "go", type: "submit" }, "Add to the scout queue"), msg,
    h("div", { id: "copybox", hidden: true, class: "stack" }, h("textarea", { id: "copytext", rows: "2", readonly: true, "aria-label": "Request text" }), h("button", { class: "ghost", type: "button", onclick: async () => { try { await navigator.clipboard.writeText($("#copytext").value); msg.textContent = "Copied."; } catch (e) { $("#copytext").select(); msg.textContent = "Select the text and copy it."; } } }, "Copy")));
  return [
    h("p", { class: "sub" }, "A request waits in the queue. Nothing starts by itself: Claude reads the queue when you next ask it to scout, with the Claude desktop app open on the PC. Pages are read at a slow, view-only pace, about 10 reels a sitting. Topic search is not built yet; a topic request is kept and flagged."),
    card("", form),
    h("h2", {}, "Queue"),
    h("div", { class: "stack" }, state.dbState === "loading" && db === null && window.claude ? card("", h("span", { class: "sub" }, "Checking for saved requests...")) : null,
      all.map(r => card("", h("div", { class: "qrow" }, h("div", {}, h("h3", {}, (r.kind === "topic" ? "" : "@") + r.target), h("div", { class: "sub" }, ({ page: "Page", topic: "Topic", competitor: "Competitor" }[r.kind] || r.kind) + " · asked " + r.asked + (r.note ? " · " + r.note : ""))), pill(r.state, { scouted: "good", queued: "wait", running: "acc", refused: "bad" }[r.state] || "wait")))))
  ];
}

/* ---------- shell ---------- */
const VIEWS = { overview: vOverview, concepts: vConcepts, reels: vReels, shapes: vShapes, growth: vGrowth, pipeline: vPipeline, request: vRequest };
function current() { const k = (location.hash || "").slice(1); return VIEWS[k] ? k : "overview"; }
function render() {
  const cur = current();
  $("#tabs").replaceChildren(...TABS.map(([k, t]) => h("a", { href: "#" + k, "aria-current": String(k === cur) }, t)));
  $("#main").replaceChildren(h("section", { class: "view on" }, h("h2", { style: "margin-top:18px" }, TABS.find(t => t[0] === cur)[1]), ...VIEWS[cur]().filter(Boolean)));
}
$("#built").textContent = "Built " + D.built;
$("#pagesel").append(...Object.keys(D.pages).map(k => h("option", { value: k }, "@" + k)));
$("#pagesel").addEventListener("change", e => { handle = e.target.value; P = D.pages[handle]; state.open = state.sel = null; state.concept = "all"; render(); });
addEventListener("hashchange", () => { render(); scrollTo(0, 0); });
render();

/* saved requests: only where the page runs as a Claude artifact with the db capability */
(async () => {
  try {
    if (!window.claude || !window.claude.use) { state.dbState = "none"; return; }
    const d = await window.claude.use("db");
    if (!d) { state.dbState = "none"; if (current() === "request") render(); return; }
    db = d;
    const timer = setTimeout(() => { state.dbState = "slow"; if (current() === "request") render(); }, 10000);
    d.collection("requests").onSnapshot(snap => { clearTimeout(timer); state.dbState = "ok"; state.dbReqs = snap.docs.map(x => ({ id: x.id, ...x.data() })).sort((a, b) => String(b.asked).localeCompare(String(a.asked))); if (current() === "request") render(); },
      () => { clearTimeout(timer); state.dbState = "none"; db = null; if (current() === "request") render(); });
  } catch (e) { state.dbState = "none"; }
})();
</script>
</body>
