<style>
/* One visual world: a night feed. Deep aubergine ground, a sunset gradient as the only loud thing, each concept its own hue.
   The reels wall (story-shaped cover cards) is where the boldness lives; everything else is quiet glass around it. */
:root{
  color-scheme:dark;
  --bg:#0b0613; --bg2:#150a24; --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09); --line:rgba(255,255,255,.12);
  --ink:#fbf7ff; --muted:#b8a8cf; --dim:#8a7ba3;
  --g1:#ffd166; --g2:#ff8a3d; --g3:#f0357f; --g4:#a43cd6; --g5:#5661e8;
  --grad:linear-gradient(100deg,var(--g1),var(--g2) 28%,var(--g3) 58%,var(--g4) 82%,var(--g5));
  --good:#3ddc97; --warn:#ffc857; --bad:#ff5d73; --wait:#9a8fb3;
  --display:"Syne","Trebuchet MS",system-ui,sans-serif; --body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box} [hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--body);-webkit-text-size-adjust:100%;overflow-x:hidden}
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 80% at 50% -10%,var(--bg2),var(--bg) 60%)}
.sky i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.42}
.sky i:nth-child(1){width:46vmax;height:46vmax;left:-14vmax;top:-18vmax;background:var(--g3)}
.sky i:nth-child(2){width:38vmax;height:38vmax;right:-14vmax;top:8vmax;background:var(--g5)}
.sky i:nth-child(3){width:34vmax;height:34vmax;left:20vmax;bottom:-22vmax;background:var(--g2);opacity:.22}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 72px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:13px}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px 18px;align-items:center;padding:26px 0 14px}
.brand{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font:800 clamp(26px,7vw,40px)/1 var(--display);margin:0;letter-spacing:-.02em}
.ring{position:relative;width:92px;height:92px;border-radius:50%;display:grid;place-items:center}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--g1),var(--g2),var(--g3),var(--g4),var(--g5),var(--g1));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px))}
.ring::after{content:"";position:absolute;inset:9px;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,255,255,.34),transparent 28%);-webkit-mask:radial-gradient(farthest-side,#000 98%,transparent);mask:radial-gradient(farthest-side,#000 98%,transparent)}
.ring b{position:relative;z-index:1;width:74px;height:74px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font:800 24px var(--display)}
.who .h{font:700 clamp(20px,5.4vw,28px)/1.1 var(--display)}
.who .facts{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:14px}
.who .facts b{font-family:var(--mono);font-weight:600}
select,input,textarea{font:500 14px var(--body);color:var(--ink);background:var(--glass2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;max-width:100%}
select option{background:#1c1030;color:var(--ink)}
::placeholder{color:var(--dim)}
/* tabs */
nav.tabs{position:sticky;top:0;z-index:6;display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;margin:0 -16px;background:linear-gradient(var(--bg) 70%,transparent);backdrop-filter:blur(8px)}
nav.tabs a{text-decoration:none;color:var(--muted);font-weight:600;font-size:13px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--glass)}
nav.tabs a[aria-current="true"]{color:#1a0b22;background:var(--grad);border-color:transparent}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--g1);outline-offset:2px}
h2{font:700 21px/1.2 var(--display);margin:30px 0 12px;text-wrap:balance;letter-spacing:-.01em}
h3{font:700 15.5px/1.3 var(--body);margin:0 0 4px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:15px 16px;backdrop-filter:blur(10px)}
.stack{display:grid;gap:12px}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--grad)}
.tile .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:700}
.tile .big{font:800 34px/1 var(--display);margin:6px 0 6px}
/* evidence */
.evi{position:relative;padding-left:20px;overflow:hidden}
.evi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--good);box-shadow:0 0 24px 2px var(--good)}
.evi.weak::before{background:var(--bad);box-shadow:0 0 24px 2px var(--bad)} .evi.mix::before{background:var(--grad);box-shadow:0 0 24px 2px var(--g3)} .evi.none::before{background:var(--wait);box-shadow:none}
.numbers{font-size:14.5px;margin:4px 0 10px}
.reading{background:rgba(255,209,102,.08);border:1px dashed rgba(255,209,102,.4);border-radius:12px;padding:9px 12px;font-size:14px}
.reading b{font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--g1);display:block;margin-bottom:2px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;background:var(--glass)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.good{color:var(--good);border-color:var(--good)} .pill.warn{color:var(--warn);border-color:var(--warn)} .pill.bad{color:var(--bad);border-color:var(--bad)} .pill.wait{color:var(--wait);border-style:dashed} .pill.acc{color:var(--g1);border-color:var(--g1)}
.pill.plain::before{display:none}
/* concepts */
.lane{display:grid;gap:5px;padding:10px 0;border-bottom:1px solid var(--line)} .lane:last-of-type{border-bottom:0}
.lane .head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.lane h3{display:flex;align-items:center;gap:8px} .sw{width:11px;height:11px;border-radius:4px;background:var(--c);box-shadow:0 0 12px var(--c);flex:none}
.track{position:relative;height:34px;border-radius:8px;background:linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat}
.dot{position:absolute;top:50%;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-radius:50%;background:var(--c);border:0;padding:0;cursor:pointer;opacity:.6}
.dot.hit{opacity:1;width:19px;height:19px;margin:-9.5px 0 0 -9.5px;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 28%,transparent),0 0 18px var(--c)}
.dot.pin{opacity:1;background:var(--bg);box-shadow:inset 0 0 0 3.5px var(--c)}
.dot.fresh{background:transparent;box-shadow:inset 0 0 0 1.5px var(--wait);opacity:1}
.med{position:absolute;top:5px;bottom:5px;width:2.5px;border-radius:2px;background:#fff}
.pagemed{position:absolute;top:0;bottom:0;width:0;border-left:1.5px dashed var(--warn);opacity:.8}
.axis{position:relative;height:20px;font-size:11px;color:var(--muted);margin-top:4px} .axis span{position:absolute;transform:translateX(-50%);font-family:var(--mono)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;vertical-align:-2px;margin-right:5px}
.s{display:inline-block;width:10px;height:10px;border-radius:50%} .s.y{background:var(--good);box-shadow:0 0 8px var(--good)} .s.n{box-shadow:inset 0 0 0 1.5px var(--dim)} .s.w{box-shadow:inset 0 0 0 1.5px var(--wait);background:repeating-linear-gradient(135deg,transparent 0 2px,var(--wait) 2px 3px)}
/* reels wall */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 12.5px var(--body);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:#fff;border-color:#fff;color:#1a0b22}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.cover{position:relative;aspect-ratio:9/14;border-radius:18px;border:0;padding:12px;text-align:left;cursor:pointer;color:#fff;font:inherit;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(120% 70% at 20% 0%,color-mix(in srgb,var(--c) 85%,transparent),transparent 60%),linear-gradient(165deg,color-mix(in srgb,var(--c) 55%,#12081f),#12081f 78%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.cover.hit{box-shadow:inset 0 0 0 2px var(--g1),0 10px 34px -12px var(--c)}
.cover .top{display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.cover .tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;background:rgba(0,0,0,.34);padding:3px 7px;border-radius:999px;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cover .x{font:600 11.5px var(--mono);padding:3px 7px;border-radius:999px;background:var(--grad);color:#1a0b22}
.cover .x.pinb{background:rgba(255,255,255,.9)}
.cover .hook{font:700 15px/1.22 var(--display);text-wrap:balance;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.cover .hook.none{font:500 13px var(--body);opacity:.75}
.cover .bot{display:flex;justify-content:space-between;align-items:flex-end;gap:6px}
.cover .views{font:600 20px/1 var(--mono)} .cover .views small{display:block;font:500 10.5px var(--body);opacity:.8;margin-top:3px}
.cover .stg{display:flex;gap:3px}
.cover .stg .s{width:7px;height:7px}
.cover:hover{transform:translateY(-3px)} .cover:active{transform:scale(.98)}
/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(6,3,12,.66);backdrop-filter:blur(4px);display:grid;align-items:end;justify-items:center}
.sheet{width:min(640px,100%);max-height:86vh;overflow:auto;background:#170c28;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 18px 26px;display:grid;gap:12px;box-shadow:0 -20px 60px -20px var(--g4)}
.sheet .bar{height:6px;border-radius:3px;background:var(--grad)}
.sheet h3{font:700 19px/1.25 var(--display)}
.close{justify-self:end;font:600 13px var(--body);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--ink);cursor:pointer}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.kv > div{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:8px 10px} .kv .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700} .kv .val{font:600 17px var(--mono)} .kv .r{font-size:12px;color:var(--muted)}
a.out{color:var(--g1);font-weight:600}
/* pipeline */
.prog{display:grid;grid-template-columns:128px 1fr 50px;gap:10px;align-items:center;font-size:13.5px}
.barp{height:11px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden} .barp i{display:block;height:100%;border-radius:6px;background:var(--grad)}
.prog.waiting .barp{background:repeating-linear-gradient(135deg,rgba(255,255,255,.14) 0 7px,transparent 7px 14px);background-size:40px 40px;box-shadow:inset 0 0 0 1px var(--wait)}
.tool{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:start}
.led{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px;background:var(--wait)} .led.working{background:var(--good);box-shadow:0 0 10px var(--good)} .led.ready{background:var(--g1);box-shadow:0 0 10px var(--g1)} .led.failed{background:var(--bad);box-shadow:0 0 10px var(--bad)}
pre.cmd{font:400 13px/1.7 var(--mono);background:#07040d;border:1px solid var(--line);border-radius:14px;padding:12px 14px;overflow-x:auto;margin:8px 0 0;color:#d9f7e8}
pre.cmd::before{content:"● ● ●";display:block;color:var(--dim);letter-spacing:3px;font-size:10px;margin-bottom:6px}
.matrix{overflow-x:auto} .matrix table{border-collapse:collapse;font-size:12px;width:100%;table-layout:fixed}
.matrix th,.matrix td{padding:6px 2px;border-bottom:1px solid var(--line);text-align:center;width:44px;font-weight:500} .matrix th{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em} .matrix th:first-child,.matrix td:first-child{text-align:left;width:auto;overflow-wrap:anywhere}
/* shapes, growth, request */
.shape .n{font:800 30px/1 var(--display)}
.qrow{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
form.req{display:grid;gap:12px} form.req label{display:grid;gap:5px;font-size:13px;font-weight:600}
button.go{font:700 14.5px var(--body);padding:11px 18px;border-radius:999px;border:0;background:var(--grad);color:#1a0b22;cursor:pointer;justify-self:start}
button.ghost{font:600 13px var(--body);padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--ink);cursor:pointer}
.msg{font-size:13px;color:var(--muted)}
footer{margin-top:40px;font-size:12px;color:var(--dim)}
@media (max-width:520px){ .prog{grid-template-columns:100px 1fr 44px} .ring{width:76px;height:76px} .ring b{width:60px;height:60px;font-size:20px} .wall{grid-template-columns:repeat(2,1fr)} }
/* motion: one load sequence, a slow sky, a scanning ring. Everything rests visible. */
@media (prefers-reduced-motion:no-preference){
  .sky i{animation:drift 26s ease-in-out infinite alternate} .sky i:nth-child(2){animation-duration:34s;animation-direction:alternate-reverse} .sky i:nth-child(3){animation-duration:40s}

  .ring::before{animation:spin 14s linear infinite} .ring::after{animation:spin 3.2s linear infinite}
  @keyframes spin{to{transform:rotate(1turn)}}
  .view > *{animation:rise .5s cubic-bezier(.2,.8,.2,1) both} .view > *:nth-child(2){animation-delay:.05s} .view > *:nth-child(3){animation-delay:.1s} .view > *:nth-child(4){animation-delay:.15s} .view > *:nth-child(n+5){animation-delay:.2s}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}}
  .cover{animation:pop .45s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i)*28ms);transition:transform .18s}
  @keyframes pop{from{opacity:0;transform:scale(.9) translateY(10px)}}
  .dot{animation:dotin .5s cubic-bezier(.2,.9,.3,1.4) both;animation-delay:calc(var(--i)*35ms)}
  @keyframes dotin{from{transform:scale(0)}}
  .dot.hit::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--c);animation:ping 2.2s ease-out infinite}
  @keyframes ping{from{transform:scale(.7);opacity:.9}to{transform:scale(1.9);opacity:0}}
  .barp i{animation:grow .9s cubic-bezier(.2,.8,.2,1) both;transform-origin:left} @keyframes grow{from{transform:scaleX(0)}}
  .prog.waiting .barp{animation:stripes 1.6s linear infinite} @keyframes stripes{to{background-position:40px 0}}
  .led.working,.led.ready{animation:blink 2s ease-in-out infinite} @keyframes blink{50%{opacity:.45}}
  .sheet{animation:up .32s cubic-bezier(.2,.8,.2,1) both} @keyframes up{from{transform:translateY(40px);opacity:0}} .scrim{animation:fade .2s both} @keyframes fade{from{opacity:0}}
  nav.tabs a,.chip,button.go,button.ghost{transition:transform .15s,background .2s} nav.tabs a:active,.chip:active,button.go:active{transform:scale(.96)}
}
</style>
