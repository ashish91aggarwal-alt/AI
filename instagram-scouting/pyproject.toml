[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tt-scout"
version = "0.1.0"
description = "Tarot Talk Instagram scout: command-line step that writes transcripts and audio numbers for queued reels."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["yt-dlp", "faster-whisper"]

[project.scripts]
tt-scout = "tt_scout.cli:main"

[tool.setuptools]
packages = ["tt_scout"]
