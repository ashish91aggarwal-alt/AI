[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tt-scout"
version = "0.2.1"
description = "Tarot Talk Instagram scout: command-line step that writes transcripts and audio numbers for queued reels."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["yt-dlp", "faster-whisper", "numpy"]

[project.scripts]
tt-scout = "tt_scout.cli:main"

[project.gui-scripts]
tt-desk = "tt_scout.desk:main"

[tool.setuptools]
packages = ["tt_scout"]

[tool.setuptools.package-data]
tt_scout = ["desk.ico"]
