<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:"Baloo 2";font-weight:400;src:url(node_modules/@fontsource/baloo-2/files/baloo-2-latin-400-normal.woff2)}
@font-face{font-family:"Baloo 2";font-weight:800;src:url(node_modules/@fontsource/baloo-2/files/baloo-2-latin-800-normal.woff2)}
@font-face{font-family:"Rozha One";src:url(node_modules/@fontsource/rozha-one/files/rozha-one-latin-400-normal.woff2)}
html,body{margin:0;background:#000}canvas{display:block}
</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="scene.js"></script><script src="styles2d.js"></script>
<script>
(async()=>{const s=new URLSearchParams(location.search).get('style')||'toon';
await Promise.all(['400 20px "Baloo 2"','800 20px "Baloo 2"','20px "Rozha One"'].map(f=>document.fonts.load(f)));
STYLES[s](document.getElementById('c').getContext('2d'));window.DONE=true;})();
</script>
